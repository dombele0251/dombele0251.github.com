<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dombele — Photographer</title>
<style>
:root {
  --bg-gradient: linear-gradient(135deg, #f6f5f3 0%, #eaeaea 100%);
  --text:#0e0e0e;
  --muted:#6b6b6b;
  --accent:#000;
  --accent-hover:#333;
  --shadow: rgba(0,0,0,0.15);
}

body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-gradient);
  color:var(--text);
  text-align:center;
  scroll-behavior: smooth;
}

.wrap {
  max-width:500px;
  margin:auto;
  padding:60px 20px;
}

.profile-pic {
  width:150px;
  height:150px;
  border-radius:50%;
  margin-bottom:20px;
  object-fit:cover;
  box-shadow: 0 8px 20px var(--shadow);
  transition: transform 0.3s ease;
}

.profile-pic:hover {
  transform: scale(1.05);
}

h1 {
  font-size:36px;
  margin:0;
  letter-spacing:4px;
  opacity:0;
  transform: translateY(-20px);
  animation: fadeInUp 1s forwards 0.2s;
}

p.tag {
  color:var(--muted);
  margin:8px 0 20px 0;
  opacity:0;
  transform: translateY(-20px);
  animation: fadeInUp 1s forwards 0.4s;
}

.meta a {
  color:var(--text);
  text-decoration:none;
  border-bottom:1px solid transparent;
}

.meta a:hover {
  border-color:var(--text);
}

.links {
  display:flex;
  flex-direction:column;
  gap:15px;
  margin:30px 0;
  opacity:0;
  transform: translateY(20px);
  animation: fadeInUp 1s forwards 0.6s;
}

.button {
  display:block;
  padding:14px 25px;
  background:var(--accent);
  color:white;
  text-decoration:none;
  border-radius:12px;
  font-weight:bold;
  box-shadow: 0 5px 15px var(--shadow);
  transition: all 0.3s ease;
}

.button:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px var(--shadow);
  background:var(--accent-hover);
}

.portfolio {
  column-count:2;
  column-gap:12px;
  margin-top:40px;
}

.portfolio img {
  width:100%;
  margin-bottom:12px;
  display:block;
  break-inside:avoid;
  cursor:pointer;
  border-radius:6px;
  transition: transform 0.3s ease, opacity 0.25s ease;
  opacity:0;
  transform: translateY(20px);
  animation: fadeInUp 1s forwards;
}

.portfolio img:hover {
  opacity:.85;
  transform: scale(1.03);
}

@media(max-width:600px){
  .portfolio {
    column-count:1;
  }
}

/* Lightbox */
.lightbox {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.lightbox img {
  max-width:90%;
  max-height:90%;
}

.lightbox.active {
  display:flex;
}

/* Animations */
@keyframes fadeInUp {
  to {
    opacity:1;
    transform:translateY(0);
  }
}

/* Sticky Mobile Button */
.sticky-book {
  display:none;
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--accent);
  color:white;
  padding:15px 30px;
  border-radius:50px;
  font-weight:bold;
  box-shadow: 0 8px 25px var(--shadow);
  z-index:1000;
  transition:all 0.3s ease;
  text-decoration:none;
}

.sticky-book:hover {
  transform:translateX(-50%) scale(1.05);
  background:var(--accent-hover);
}

@media(max-width:700px){
  .sticky-book {
    display:block;
  }
}
</style>
</head>
<body>

<div class="wrap">
  <img src="your-photo.jpg" alt="Dombele" class="profile-pic">

  <h1>Dombele</h1>
  <p class="tag">Photographer · Fashion | Beauty | Portraits</p>

  <p class="meta">📍 UK</p>
  <p class="meta"><a href="mailto:studio@dombele.com">studio@dombele.com</a></p>
  <p class="meta"><a href="https://instagram.com/dombele.studio" target="_blank">@dombele.studio</a></p>

  <div class="links">
    <a href="mailto:studio@dombele.com" class="button">Book a Shoot</a>
    <a href="https://dombele.com/portfolio" class="button">View Portfolio</a>
    <a href="https://instagram.com/dombele.studio" target="_blank" class="button">Instagram</a>
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSxxxxxxx/viewform" target="_blank" class="button">Join Email List</a>
  </div>

  <section class="portfolio">
    <img src="website-1.jpg" alt="">
    <img src="website-2.jpg" alt="">
    <img src="website-3.jpg" alt="">
    <img src="website-4.jpg" alt="">
  </section>
</div>

<!-- Sticky Book Button -->
<a href="mailto:studio@dombele.com" class="sticky-book">Book a Shoot</a>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img">
</div>

<script>
const images = document.querySelectorAll(".portfolio img")
const lightbox = document.getElementById("lightbox")
const lightboxImg = document.getElementById("lightbox-img")

images.forEach((img, index)=>{
  img.style.animationDelay = `${0.2 + index * 0.1}s`;
  img.addEventListener("click",()=>{
    lightbox.classList.add("active")
    lightboxImg.src = img.src
  })
})

lightbox.addEventListener("click",()=>{
  lightbox.classList.remove("active")
})
</script>

</body>
</html>
