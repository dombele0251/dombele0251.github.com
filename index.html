<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dombele — Photography</title>
<link href="https://googleapis.com" rel="stylesheet">

<style>
:root {
    --bg: #ffffff;
    --text: #000000;
    --accent: #666;
    --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    overflow-x: hidden;
}

/* NAVIGATION */
nav {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 30px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
    mix-blend-mode: difference;
    color: white;
}

nav a {
    color: inherit;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 400;
}

/* HERO / LANDING */
.hero {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #000;
    overflow: hidden;
}

.hero img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.7;
}

.hero h1 {
    position: relative;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(60px, 12vw, 180px);
    font-weight: 300;
    color: white;
    margin: 0;
    letter-spacing: -0.02em;
}

/* CATEGORY SELECTOR (The "Home" Grid) */
.albums {
    display: flex;
    flex-direction: column;
}

.album {
    position: relative;
    height: 80vh;
    width: 100%;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.album img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: var(--transition);
    transform: scale(1.02);
}

.album:hover img {
    transform: scale(1);
    filter: brightness(0.7);
}

.album-title {
    position: absolute;
    font-family: "Cormorant Garamond";
    font-size: 80px;
    color: white;
    z-index: 2;
    pointer-events: none;
    transition: var(--transition);
    opacity: 0.8;
}

.album:hover .album-title {
    opacity: 1;
    letter-spacing: 5px;
}

/* EDITORIAL GRID (Inside Sections) */
.section {
    display: none;
    padding: 150px 10% 100px;
    opacity: 0;
    transition: opacity 1s ease;
}

.section.active {
    display: block;
    opacity: 1;
}

.editorial-flow {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 100px;
}

.editorial-flow img {
    max-width: 100%;
    height: auto;
    object-fit: cover;
}

/* Varying widths for that "Appelgren" feel */
.editorial-flow img:nth-child(even) { width: 60%; align-self: flex-start; }
.editorial-flow img:nth-child(odd) { width: 80%; align-self: flex-end; }
.editorial-flow img:nth-child(3n) { width: 100%; align-self: center; }

/* BACK BUTTON */
.back-btn {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    color: black;
    padding: 15px 30px;
    border-radius: 50px;
    font-size: 10px;
    letter-spacing: 2px;
    cursor: pointer;
    z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    display: none;
}

/* LIGHTBOX (Minimal) */
.lightbox {
    position: fixed;
    inset: 0;
    background: #fff;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
}

.lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
}

@media (max-width: 768px) {
    .album-title { font-size: 40px; }
    .editorial-flow img { width: 100% !important; }
}
</style>
</head>
<body>

<nav>
    <a href="#" onclick="goHome()">Dombele</a>
    <a href="#" onclick="goHome()">Archive</a>
</nav>

<div class="back-btn" id="backBtn" onclick="goHome()">CLOSE PROJECT</div>

<!-- LANDING -->
<div id="home-view">
    <section class="hero">
        <img src="website-1.jpg" alt="Hero">
        <h1>Dombele</h1>
    </section>

    <section class="albums">
        <div class="album" onclick="openSection('fashion')">
            <img src="website-90.jpg">
            <div class="album-title">Fashion</div>
        </div>
        <div class="album" onclick="openSection('concert')">
            <img src="website-98.jpg">
            <div class="album-title">Concert</div>
        </div>
        <div class="album" onclick="openSection('studio')">
            <img src="website-161.jpg">
            <div class="album-title">Studio</div>
        </div>
        <div class="album" onclick="openSection('gym')">
            <img src="website-140.jpg">
            <div class="album-title">Gym</div>
        </div>
    </section>
</div>

<!-- PROJECT SECTIONS -->
<section id="fashion" class="section">
    <div class="editorial-flow" id="fashion-grid"></div>
</section>

<section id="concert" class="section">
    <div class="editorial-flow" id="concert-grid"></div>
</section>

<section id="studio" class="section">
    <div class="editorial-flow" id="studio-grid"></div>
</section>

<section id="gym" class="section">
    <div class="editorial-flow" id="gym-grid"></div>
</section>

<div class="lightbox" id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img">
</div>

<script>
const data = {
    fashion: [87,90,93,94,95,107,108,109,110],
    concert: [91,92,96,97,98,99,100,101,102,103],
    studio: [161,162,163,164,165,166,167,169,170],
    gym: [138,139,140,141,142,143]
};

function buildGrids() {
    for (const [category, ids] of Object.entries(data)) {
        const container = document.getElementById(`${category}-grid`);
        ids.forEach(n => {
            const img = document.createElement('img');
            img.src = `website-${n}.jpg`;
            img.loading = "lazy";
            img.onclick = () => {
                document.getElementById('lightbox-img').src = img.src;
                document.getElementById('lightbox').style.display = 'flex';
            };
            container.appendChild(img);
        });
    }
}

function openSection(id) {
    document.getElementById('home-view').style.display = 'none';
    document.getElementById('backBtn').style.display = 'block';
    const sec = document.getElementById(id);
    sec.classList.add('active');
    window.scrollTo(0,0);
}

function goHome() {
    document.getElementById('home-view').style.display = 'block';
    document.getElementById('backBtn').style.display = 'none';
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    window.scrollTo(0,0);
}

buildGrids();
</script>

</body>
</html>
