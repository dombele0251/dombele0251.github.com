<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Dombele Studio | Photographer working in London, Bristol & Taunton</title>
    <meta name="description" content="Editorial, Fashion, and Music Photographer working in London, Bristol, and Taunton. Expertise in high-end photo retouching.">
    
    <style>
        :root {
            --bg: #ffffff;
            --text: #111111;
            --accent: #f8f8f8;
            --transition: 0.5s cubic-bezier(0.2, 1, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: var(--bg);
            font-family: "Inter", -apple-system, Helvetica, Arial, sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER & NAVIGATION */
        header {
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid #f0f0f0;
        }

        .logo img { height: 16px; cursor: pointer; transition: 0.3s; }
        .logo img:hover { opacity: 0.5; }

        .nav { 
            display: flex; 
            gap: 20px; 
            align-items: center;
        }

        .nav span {
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            opacity: 0.3;
            transition: var(--transition);
            border-bottom: 1px solid transparent;
            padding-bottom: 2px;
            white-space: nowrap;
        }

        .nav span.active, .nav span:hover { opacity: 1; }
        .nav span.active { border-bottom: 1px solid var(--text); }

        /* Desktop Inquire Button */
        .nav-book {
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--bg);
            background: var(--text);
            padding: 8px 18px;
            margin-left: 10px;
            transition: var(--transition);
        }
        .nav-book:hover { background: #444; color: #fff; }

        /* MAIN CONTENT AREA */
        main.content-area {
            flex: 1;
        }

        .page { display: none; }
        .page.active { display: block; }

        /* MASONRY GRID */
        .masonry {
            column-count: 4;
            column-gap: 15px;
            padding: 20px 60px 40px;
        }

        .item {
            break-inside: avoid;
            margin-bottom: 15px;
            overflow: hidden;
            background: var(--accent);
            cursor: pointer;
        }

        .item img {
            width: 100%;
            display: block;
            transition: transform 1.2s cubic-bezier(0.2, 1, 0.2, 1);
        }

        .item:hover img { transform: scale(1.05); }

        /* ABOUT SECTION */
        .about-wrap { max-width: 1100px; margin: auto; padding: 100px 60px; }
        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start; }
        .about-text h1 { font-size: 10px; letter-spacing: 0.3em; margin-bottom: 30px; opacity: 0.5; text-transform: uppercase; }
        .about-text p { font-size: 17px; line-height: 1.8; margin-bottom: 25px; font-weight: 300; }
        
        .about-cta {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: var(--text);
            color: var(--bg);
            text-decoration: none;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: var(--transition);
        }
        .about-cta:hover { background: #444; color: #fff; }

        /* FOOTER */
        footer {
            padding: 40px 60px;
            display: flex;
            justify-content: center;
            gap: 40px;
            background: var(--bg);
            border-top: 1px solid #f0f0f0;
        }

            color: var(--text);
            text-decoration: none;
            font-size: 11px;
