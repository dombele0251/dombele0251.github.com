<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dombele — Photographer</title>

    <style>
        :root {
            --bg: #ffffff;
            --text: #111111;
            --accent: #f0f0f0;
            --transition: 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            font-family: "Inter", Helvetica, Arial, sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER */
        header {
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid var(--accent);
        }

        .logo img {
            height: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .logo img:hover { opacity: 0.6; }

        .nav {
            display: flex;
            gap: 24px;
            font-size: 10px;
            letter-spacing: .2em;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav::-webkit-scrollbar { display: none; }

        .nav span {
            opacity: .35;
            cursor: pointer;
            transition: var(--transition);
            padding-bottom: 4px;
            border-bottom: 1px solid transparent;
            text-transform: uppercase;
        }

        .nav span.active, .nav span:hover {
            opacity: 1;
        }
        .nav span.active { border-bottom: 1px solid var(--text); }

        /* PAGES */
        .page { display: none; opacity: 0; transition: opacity 0.5s ease; }
        .page.active { display: block; opacity: 1; }

        /* MASONRY GRID */
        .masonry {
            column-count: 4;
            column-gap: 15px;
            padding: 40px;
        }

        .item {
            break-inside: avoid;
            margin-bottom: 15px;
            overflow: hidden; /* Keeps the zoom contained */
            background: #f9f9f9;
        }

        .item img {
            width: 100%;
            display: block;
            cursor: pointer;
            transition: transform 0.8s ease;
        }

        .item:hover img {
            transform: scale(1.05);
        }

        /* ABOUT SECTION */
        .about-wrap {
            max-width: 1200px;
            margin: auto;
            padding: 80px 40px;
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: start;
        }

        .about-grid img { width: 100%; display: block; }

        .about-text h2 {
            font-size: 10px;
            letter-spacing: .3em;
            opacity: .4;
            margin-bottom: 30px;
        }

        .about-text p {
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 24px;
            font-weight: 300;
        }

        /* LIGHTBOX */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.98);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .lightbox.open { display: flex; }

        .lightbox img {
            max-width: 85vw;
            max-height: 80vh;
            object-fit: contain;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        .lb-controls {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            pointer-events: none;
        }

        .lb-nav {
            pointer-events: auto;
            background: none;
            border: none;
            font-size: 40px;
            cursor: pointer;
            padding: 20px;
            transition: 0.2s;
        }
        .lb-nav:hover { opacity: 0.5; }

        .lb-close {
            position: absolute;
            top: 40px;
            right: 40px;
            font-size: 10px;
            letter-spacing: .2em;
            cursor: pointer;
        }

        /* RESPONSIVE */
        @media(max-width: 1024px) { .masonry { column-count: 3; } }
        @media(max-width: 768px) {
            .masonry { column-count: 2; padding: 20px 15px; }
            .about-content { grid-template-columns: 1fr; gap: 40px; }
            header { padding: 25px 20px; flex-direction: column; gap: 20px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="goToHome()">
        <img src="black logo.png" alt="Dombele Studio">
    </div>

    <nav class="nav" id="main-nav">
        <span class="active" data-cat="ALL" onclick="showPage('work','ALL', this)">All</span>
        <span data-cat="EDITORIAL" onclick="showPage('work','EDITORIAL', this)">Editorial</span>
        <span data-cat="STUDIO" onclick="showPage('work','STUDIO', this)">Studio</span>
        <span data-cat="CONCERT" onclick="showPage('work','CONCERT', this)">Concert</span>
        <span data-cat="GYM" onclick="showPage('work','GYM', this)">Gym</span>
        <span data-cat="PRODUCT" onclick="showPage('work','PRODUCT', this)">Product</span>
        <span onclick="showPage('about', null, this)">About</span>
    </nav>
</header>

<div id="page-work" class="page active">
    <div class="masonry" id="grid"></div>
</div>

<div id="page-about" class="page">
    <div class="about-wrap">
        <div class="about-content">
            <div class="about-grid">
                <img src="A67D.jpg" alt="Portrait">
            </div>
            <div class="about-text">
                <h2>ABOUT</h2>
                <p>I’m a UK-based photographer working across fashion, editorial, and live music.</p>
                <p>A background in photo retouching informs a precise approach to light, tone, and image-making.</p>
                <div class="contact-block" style="margin-top: 40px;">
                    <h2 style="margin-bottom: 10px;">CONTACT</h2>
                    <p style="font-size: 14px;">
                        <a href="mailto:studio@dombele.com" style="color:inherit; text-decoration: none; border-bottom: 1px solid #ddd;">Email</a><br>
                        <a href="#" style="color:inherit; text-decoration: none; border-bottom: 1px solid #ddd;">Instagram</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="lightbox" id="lightbox" onclick="if(event.target===this) closeLB()">
    <div class="lb-close" onclick="closeLB()">CLOSE</div>
    <div class="lb-controls">
        <button class="lb-nav" onclick="shiftLB(-1)">‹</button>
        <button class="lb-nav" onclick="shiftLB(1)">›</button>
    </div>
    <img id="lb-img" src="">
    <div id="lb-counter" style="position:absolute; bottom:40px; font-size:10px; opacity:0.5;"></div>
</div>

<script>
const DATA = [
    {src:"website-179.jpg", cat:"STUDIO"},
    {src:"website-197.jpg", cat:"STUDIO"},
    {src:"website-136.jpg", cat:"CONCERT"},
    {src:"website-91.jpg",  cat:"CONCERT"},
    {src:"DSC00913.jpg", cat:"GYM"},
    {src:"website-9.jpg",  cat:"EDITORIAL"},
    {src:"website-79.jpg", cat:"PRODUCT"}
    // ... add the rest of your images here
];

const grid = document.getElementById("grid");
let visibleImages = [];
let currentIndex = 0;

// Initialize Grid
function init() {
    DATA.forEach(({src, cat}) => {
        const div = document.createElement("div");
        div.className = "item";
        div.dataset.cat = cat;
        
        const img = document.createElement("img");
        img.src = src;
        img.loading = "lazy";
        img.alt = `Photography category: ${cat}`;
        img.onclick = () => openLB(src);
        
        div.appendChild(img);
        grid.appendChild(div);
    });
}

function showPage(pageId, cat = "ALL", element = null) {
    // Switch Pages
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`page-${pageId}`).classList.add('active');

    // Handle Nav Classes
    document.querySelectorAll('.nav span').forEach(s => s.classList.remove('active'));
    if (element) element.classList.add('active');

    // Filter Logic
    if (pageId === 'work') {
        document.querySelectorAll('.item').forEach(item => {
            item.style.display = (cat === "ALL" || item.dataset.cat === cat) ? "block" : "none";
        });
    }
    window.scrollTo(0,0);
}

function goToHome() {
    const allBtn = document.querySelector('[data-cat="ALL"]');
    showPage('work', 'ALL', allBtn);
}

// Lightbox Logic
function openLB(src) {
    const activeItems = document.querySelectorAll('.item:not([style*="display: none"]) img');
    visibleImages = Array.from(activeItems).map(img => img.src);
    currentIndex = visibleImages.indexOf(src);
    
    updateLB();
    document.getElementById("lightbox").classList.add("open");
    document.body.style.overflow = "hidden"; // Prevent background scroll
}

function updateLB() {
    const img = document.getElementById("lb-img");
    img.src = visibleImages[currentIndex];
    document.getElementById("lb-counter").innerText = `${currentIndex + 1} / ${visibleImages.length}`;
}

function shiftLB(step) {
    currentIndex = (currentIndex + step + visibleImages.length) % visibleImages.length;
    updateLB();
}

function closeLB() {
    document.getElementById("lightbox").classList.remove("open");
    document.body.style.overflow = "auto";
}

// Keyboard Support
window.addEventListener('keydown', (e) => {
    if (!document.getElementById("lightbox").classList.contains("open")) return;
    if (e.key === "ArrowRight") shiftLB(1);
    if (e.key === "ArrowLeft") shiftLB(-1);
    if (e.key === "Escape") closeLB();
});

init();
</script>
</body>
</html>
