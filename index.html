<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOMBELE</title>

<style>
:root{
--bg:#f7f6f4;
--text:#111;
--muted:#888;
}

body{
margin:0;
background:var(--bg);
font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
color:var(--text);
}

/* HERO */
.hero{
height:100vh;
position:relative;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.hero img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
filter:brightness(.82);
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to bottom, rgba(0,0,0,.2), rgba(0,0,0,.5));
}

.hero-content{
position:relative;
z-index:2;
color:white;
text-align:center;
}

.hero h1{
font-size:64px;
letter-spacing:12px;
margin:0;
font-weight:500;
}

.hero p{
margin-top:14px;
font-size:12px;
letter-spacing:3px;
opacity:.85;
}

/* SECTION */
.section{
max-width:1000px;
margin:120px auto;
padding:0 20px;
}

.section h2{
font-size:12px;
letter-spacing:3px;
margin-bottom:30px;
color:var(--muted);
}

/* GRID */
.portfolio{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:40px;
}

.portfolio img{
width:100%;
cursor:pointer;
opacity:0;
transform:translateY(30px);
transition:all 1s ease;
}

.portfolio img.loaded{
opacity:1;
transform:translateY(0);
}

/* MOBILE */
@media(max-width:700px){
.portfolio{grid-template-columns:1fr;}
.hero h1{font-size:40px;}
}

/* LIGHTBOX */
.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.lightbox img{
max-width:90%;
max-height:90%;
}

.lightbox.active{
display:flex;
}

/* FOOTER */
.footer{
text-align:center;
margin:120px 0 60px;
color:var(--muted);
font-size:12px;
letter-spacing:2px;
}
</style>

</head>

<body>

<section class="hero">
<img src="website-1.jpg">
<div class="hero-content">
<h1>DOMBELE</h1>
<p>PHOTOGRAPHER</p>
</div>
</section>

<section class="section">
<h2>FASHION</h2>
<div class="portfolio" id="fashion"></div>
</section>

<section class="section">
<h2>CONCERT</h2>
<div class="portfolio" id="concert"></div>
</section>

<section class="section">
<h2>GYM</h2>
<div class="portfolio" id="gym"></div>
</section>

<div class="footer">
STUDIO@DOMBELE.COM<br>© 2026
</div>

<div class="lightbox" id="lightbox">
<img id="lightbox-img">
</div>

<script>
// WAIT FOR PAGE LOAD (fixes most issues)
window.addEventListener("DOMContentLoaded", () => {

// IMAGE GROUPS
const fashion = [87,90,93,94,95,107,108,109,110]

const concert = [
91,92,96,97,98,99,100,101,102,103,
104,105,106,120,121,122,123,124,125,126,
127,128,129,130,131,132,133,134,135,136
]

const gym = [
35,138,139,140,141,142,143,145,200,201,
202,203,204,234
]

// HELPER
const build = arr => arr.map(n => `website-${n}.jpg`)

// OBSERVER
const observer = new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add("loaded")
}
})
},{threshold:0.2})

// LOAD FUNCTION
function load(containerId, list){
const el = document.getElementById(containerId)
if(!el) return

list.forEach(src=>{
const img = document.createElement("img")
img.src = src
img.loading = "lazy"
observer.observe(img)
el.appendChild(img)
})
}

// LOAD ALL
load("fashion", build(fashion))
load("concert", build(concert))
load("gym", build(gym))

// LIGHTBOX
const lightbox = document.getElementById("lightbox")
const lightboxImg = document.getElementById("lightbox-img")

document.querySelectorAll(".portfolio").forEach(section=>{
section.addEventListener("click",(e)=>{
if(e.target.tagName==="IMG"){
lightboxImg.src = e.target.src
lightbox.classList.add("active")
}
})
})

lightbox.addEventListener("click",()=>{
lightbox.classList.remove("active")
})

})
</script>

</body>
</html>
