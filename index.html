<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dombele — Photographer</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
--bg:#f5f4f1;
--text:#111;
--muted:#777;
--line:#e5e5e5;
}

body{
margin:0;
background:var(--bg);
font-family:Inter, sans-serif;
color:var(--text);
}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
padding:20px 40px;
display:flex;
justify-content:space-between;
z-index:100;
mix-blend-mode:difference;
}

nav a{
color:white;
text-decoration:none;
font-size:12px;
letter-spacing:3px;
}

/* HERO */
.hero{
height:100vh;
position:relative;
}

.hero img{
width:100%;
height:100%;
object-fit:cover;
filter:brightness(.8);
}

.hero h1{
position:absolute;
bottom:40px;
left:40px;
color:white;
font-size:80px;
font-family:"Cormorant Garamond", serif;
font-weight:300;
}

/* ALBUM GRID */
.albums{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:2px;
margin-top:-2px;
}

.album{
position:relative;
cursor:pointer;
height:50vh;
overflow:hidden;
}

.album img{
width:100%;
height:100%;
object-fit:cover;
transition:transform .8s ease;
}

.album:hover img{
transform:scale(1.05);
}

.album-title{
position:absolute;
bottom:20px;
left:20px;
color:white;
font-size:28px;
font-family:"Cormorant Garamond";
}

/* SECTIONS */
.section{
display:none;
padding:80px 40px;
}

.section.active{
display:block;
}

/* GRID TYPES */
.grid{
display:grid;
gap:12px;
}

.fashion{grid-template-columns:repeat(12,1fr);}
.fashion img:nth-child(3n){grid-column:span 7;}
.fashion img{grid-column:span 5;}

.concert{grid-template-columns:repeat(4,1fr);}

.studio{grid-template-columns:repeat(3,1fr);}

.gym{grid-template-columns:repeat(2,1fr);}

/* IMAGES */
.grid img{
width:100%;
cursor:pointer;
}

/* BACK BUTTON */
.back{
margin-bottom:30px;
cursor:pointer;
font-size:12px;
letter-spacing:2px;
color:var(--muted);
}

/* LIGHTBOX */
.lightbox{
position:fixed;
inset:0;
background:black;
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.lightbox img{
max-width:90%;
max-height:90%;
}
</style>
</head>

<body>

<nav>
<a href="#">DOMBELE</a>
<a href="#" onclick="goHome()">HOME</a>
</nav>

<!-- HERO -->
<section class="hero">
<img src="website-1.jpg">
<h1>Dombele</h1>
</section>

<!-- ALBUM SELECT -->
<section class="albums" id="albums">

<div class="album" onclick="openSection('fashion')">
<img src="website-90.jpg">
<div class="album-title">Fashion</div>
</div>

<div class="album" onclick="openSection('concert')">
<img src="website-98.jpg">
<div class="album-title">Concert</div>
</div>

<div class="album" onclick="openSection('studio')">
<img src="website-161.jpg">
<div class="album-title">Studio</div>
</div>

<div class="album" onclick="openSection('gym')">
<img src="website-140.jpg">
<div class="album-title">Gym</div>
</div>

</section>

<!-- SECTIONS -->

<section id="fashion" class="section">
<div class="back" onclick="goHome()">← BACK</div>
<div class="grid fashion" id="fashion-grid"></div>
</section>

<section id="concert" class="section">
<div class="back" onclick="goHome()">← BACK</div>
<div class="grid concert" id="concert-grid"></div>
</section>

<section id="studio" class="section">
<div class="back" onclick="goHome()">← BACK</div>
<div class="grid studio" id="studio-grid"></div>
</section>

<section id="gym" class="section">
<div class="back" onclick="goHome()">← BACK</div>
<div class="grid gym" id="gym-grid"></div>
</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
<img id="lightbox-img">
</div>

<script>

// DATA
const fashion = [87,90,93,94,95,107,108,109,110];
const concert = [91,92,96,97,98,99,100,101,102,103];
const studio = [161,162,163,164,165,166,167,169,170];
const gym = [138,139,140,141,142,143];

// BUILD
function build(id, arr){
const grid = document.getElementById(id);
arr.forEach(n=>{
const img=document.createElement("img");
img.src=`website-${n}.jpg`;
img.onclick=()=>openLightbox(img.src);
grid.appendChild(img);
});
}

build("fashion-grid",fashion);
build("concert-grid",concert);
build("studio-grid",studio);
build("gym-grid",gym);

// NAVIGATION
function openSection(id){
document.getElementById("albums").style.display="none";
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
window.scrollTo(0,0);
}

function goHome(){
document.getElementById("albums").style.display="grid";
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
window.scrollTo(0,0);
}

// LIGHTBOX
function openLightbox(src){
document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src=src;
}

function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}

</script>

</body>
</html>
