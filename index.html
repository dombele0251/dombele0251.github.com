<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOMBELE</title>

<style>
:root{
--bg:#f8f7f5;
--text:#111;
--muted:#777;
}

body{
margin:0;
background:var(--bg);
font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
color:var(--text);
}

/* HERO */

.hero{
height:100vh;
position:relative;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
filter:brightness(.85);
}

.hero-content{
position:relative;
z-index:2;
color:white;
}

.hero h1{
font-size:56px;
letter-spacing:10px;
margin:0;
font-weight:500;
}

.hero p{
margin-top:12px;
font-size:14px;
letter-spacing:2px;
opacity:.85;
}

/* SECTION */

.section{
max-width:1100px;
margin:120px auto;
padding:0 20px;
}

/* GRID */

.portfolio{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.portfolio img{
width:100%;
height:100%;
object-fit:cover;
cursor:pointer;
opacity:0;
transform:translateY(20px);
transition:all .8s ease;
}

.portfolio img.loaded{
opacity:1;
transform:translateY(0);
}

/* MOBILE */

@media(max-width:900px){
.portfolio{
grid-template-columns:repeat(2,1fr);
}
.hero h1{
font-size:40px;
}
}

/* LIGHTBOX */

.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.95);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.lightbox img{
max-width:90%;
max-height:90%;
}

.lightbox.active{
display:flex;
}

/* FOOTER */

.footer{
text-align:center;
margin:120px 0 60px;
color:var(--muted);
font-size:13px;
letter-spacing:1px;
}
</style>

</head>

<body>

<!-- HERO -->

<section class="hero">
<img src="website-1.jpg">
<div class="hero-content">
<h1>DOMBELE</h1>
<p>PHOTOGRAPHER</p>
</div>
</section>

<!-- PORTFOLIO -->

<section class="section">
<div class="portfolio" id="portfolio"></div>
</section>

<div class="footer">
© 2026 DOMBELE
</div>

<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">
<img id="lightbox-img">
</div>

<script>
// CONFIG
const TOTAL_IMAGES = 242
const INITIAL_LOAD = 12
const LOAD_MORE = 12

const portfolio = document.getElementById("portfolio")
let loaded = 0

const observer = new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add("loaded")
}
})
})

function createImage(src){
const img = document.createElement("img")
img.src = src
img.loading = "lazy"
observer.observe(img)
return img
}

function loadImages(count){
for(let i=0;i<count;i++){
if(loaded >= TOTAL_IMAGES) return
const src = `website-${loaded+1}.jpg`
portfolio.appendChild(createImage(src))
loaded++
}
}

loadImages(INITIAL_LOAD)

window.addEventListener("scroll", ()=>{
if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 300){
loadImages(LOAD_MORE)
}
})

// LIGHTBOX
const lightbox = document.getElementById("lightbox")
const lightboxImg = document.getElementById("lightbox-img")

portfolio.addEventListener("click",(e)=>{
if(e.target.tagName==="IMG"){
lightboxImg.src = e.target.src
lightbox.classList.add("active")
}
})

lightbox.addEventListener("click",()=>{
lightbox.classList.remove("active")
})
</script>

</body>
</html>
