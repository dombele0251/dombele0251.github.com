<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOMBELE</title>

<style>
:root{
--bg:#f7f6f4;
--text:#111;
--muted:#888;
}

body{
margin:0;
background:var(--bg);
font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
color:var(--text);
}

/* HERO */
.hero{
height:100vh;
position:relative;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.hero img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
filter:brightness(.82);
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to bottom, rgba(0,0,0,.2), rgba(0,0,0,.5));
}

.hero-content{
position:relative;
z-index:2;
color:white;
text-align:center;
}

.hero h1{
font-size:64px;
letter-spacing:12px;
margin:0;
font-weight:500;
}

.hero p{
margin-top:14px;
font-size:12px;
letter-spacing:3px;
opacity:.85;
}

/* SECTION */
.section{
max-width:1000px;
margin:140px auto;
padding:0 20px;
}

/* GRID */
.portfolio{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:40px;
}

.portfolio img{
width:100%;
cursor:pointer;
opacity:0;
transform:translateY(30px);
transition:all 1.2s cubic-bezier(.2,.7,.2,1);
}

.portfolio img:nth-child(odd){transition-delay:.1s;}
.portfolio img:nth-child(even){transition-delay:.25s;}

.portfolio img.loaded{
opacity:1;
transform:translateY(0);
}

/* MOBILE */
@media(max-width:700px){
.portfolio{grid-template-columns:1fr;}
.hero h1{font-size:40px;}
}

/* LIGHTBOX */
.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.lightbox img{
max-width:90%;
max-height:90%;
}

.lightbox.active{
display:flex;
}

/* FOOTER */
.footer{
text-align:center;
margin:140px 0 60px;
color:var(--muted);
font-size:12px;
letter-spacing:2px;
}
</style>

</head>

<body>

<!-- HERO -->

<section class="hero">
<img src="website-1.jpg">
<div class="hero-content">
<h1>DOMBELE</h1>
<p>PHOTOGRAPHER</p>
</div>
</section>

<!-- PORTFOLIO -->

<section class="section">
<div class="portfolio" id="portfolio"></div>
</section>

<div class="footer">
STUDIO@DOMBELE.COM<br>© 2026
</div>

<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">
<img id="lightbox-img">
</div>

<script>
// TOTAL FILES IN REPO
const TOTAL_IMAGES = 242

// EXCLUDED IMAGES (your list)
const excluded = [
3,5,20,36,47,76,88,89,137,144,149,152,154,160,188,205,206,229
]

// BUILD FINAL IMAGE LIST
const imageList = []
for(let i=1;i<=TOTAL_IMAGES;i++){
  if(!excluded.includes(i)){
    imageList.push(`website-${i}.jpg`)
  }
}

// LOAD SETTINGS
const INITIAL_LOAD = 8
const LOAD_MORE = 8

const portfolio = document.getElementById("portfolio")
let loaded = 0

const observer = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add("loaded")
    }
  })
},{threshold:0.2})

function createImage(src){
  const img = document.createElement("img")
  img.src = src
  img.loading = "lazy"
  observer.observe(img)
  return img
}

function loadImages(count){
  for(let i=0;i<count;i++){
    if(loaded >= imageList.length) return

    const src = imageList[loaded]
    portfolio.appendChild(createImage(src))
    loaded++
  }
}

// INITIAL LOAD
loadImages(INITIAL_LOAD)

// INFINITE SCROLL
window.addEventListener("scroll", ()=>{
  if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 200){
    loadImages(LOAD_MORE)
  }
})

// LIGHTBOX
const lightbox = document.getElementById("lightbox")
const lightboxImg = document.getElementById("lightbox-img")
let currentIndex = 0

portfolio.addEventListener("click",(e)=>{
  if(e.target.tagName==="IMG"){
    const imgs = Array.from(portfolio.querySelectorAll("img"))
    currentIndex = imgs.indexOf(e.target)
    lightboxImg.src = imgs[currentIndex].src
    lightbox.classList.add("active")
  }
})

document.addEventListener("keydown",(e)=>{
  const imgs = portfolio.querySelectorAll("img")
  if(lightbox.classList.contains("active")){
    if(e.key==="ArrowRight"){
      currentIndex = (currentIndex+1)%imgs.length
      lightboxImg.src = imgs[currentIndex].src
    }
    if(e.key==="ArrowLeft"){
      currentIndex = (currentIndex-1+imgs.length)%imgs.length
      lightboxImg.src = imgs[currentIndex].src
    }
    if(e.key==="Escape"){
      lightbox.classList.remove("active")
    }
  }
})

lightbox.addEventListener("click",()=>{
  lightbox.classList.remove("active")
})
</script>

</body>
</html>
