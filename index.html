<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DOMBELE — Photographer</title>

<style>

:root{
--bg:#f6f5f3;
--text:#0e0e0e;
--muted:#6b6b6b;
--line:#e6e4e0;
}

body{
margin:0;
background:var(--bg);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
color:var(--text);
text-align:center;
}

.wrap{
max-width:1200px;
margin:auto;
padding:60px 20px;
}

.logo{
width:90px;
margin-bottom:25px;
}

h1{
letter-spacing:6px;
font-size:48px;
margin:0;
}

.tag{
color:var(--muted);
margin:10px 0 30px 0;
}

.rule{
width:120px;
height:1px;
background:var(--line);
margin:25px auto 30px auto;
}

.meta{
color:var(--muted);
margin:6px 0;
}

a{
color:var(--text);
text-decoration:none;
border-bottom:1px solid transparent;
}

a:hover{
border-color:var(--text);
}

/* MASONRY PORTFOLIO */

.portfolio{
column-count:4;
column-gap:12px;
margin-top:60px;
}

.portfolio img{
width:100%;
margin-bottom:12px;
display:block;
break-inside:avoid;
transition:opacity .25s ease;
}

.portfolio img:hover{
opacity:.85;
}

/* TABLET */

@media(max-width:1000px){
.portfolio{
column-count:3;
}
}

/* PHONE */

@media(max-width:600px){
.portfolio{
column-count:2;
}
}

footer{
margin-top:60px;
padding-top:20px;
border-top:1px solid var(--line);
color:var(--muted);
font-size:14px;
}

</style>

</head>

<body>

<div class="wrap">

<img src="black logo.png" class="logo">

<h1>DOMBELE</h1>

<p class="tag">Photographer · Fashion | Beauty | Portraits</p>

<div class="rule"></div>

<p class="meta"><a href="mailto:studio@dombele.com">studio@dombele.com</a></p>
