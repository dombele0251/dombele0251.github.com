<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dombele</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:"Inter",sans-serif;
background:#f5f5f5;
color:#111;
}

/* HEADER */
header{
text-align:center;
padding:50px 20px 20px;
}

.logo img{
height:40px;
margin-bottom:20px;
}

nav{
display:flex;
justify-content:center;
gap:30px;
flex-wrap:wrap;
}

nav a{
font-size:11px;
letter-spacing:.2em;
text-transform:uppercase;
color:#666;
cursor:pointer;
}

/* GRID */
.container{
max-width:1300px;
margin:auto;
padding:40px 20px;
}

.grid{
display:grid;
grid-template-columns:2fr 1fr 1fr;
gap:30px;
margin-bottom:40px;
}

.grid img{
width:100%;
display:block;
object-fit:cover;
}

/* BIG IMAGE */
.big{
grid-row:span 2;
}

/* SMALL GRID */
.small-stack{
display:grid;
gap:30px;
}

.small-stack img{
height:100%;
}

/* LIGHTBOX */
.lightbox{
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.lightbox.open{display:flex;}

.lightbox img{
max-width:90%;
max-height:90%;
}

/* MOBILE */
@media(max-width:900px){
.grid{
grid-template-columns:1fr;
}
.big{grid-row:auto;}
}
</style>

</head>

<body>

<header>
<div class="logo">
<img src="black logo.png">
</div>

<nav>
<a>Overview</a>
<a>Fashion</a>
<a>Concert</a>
<a>Studio</a>
<a>Gym</a>
</nav>
</header>

<div class="container" id="container"></div>

<div class="lightbox" id="lightbox" onclick="closeLB()">
<img id="lb-img">
</div>

<script>
const ALL = Array.from({length:242},(_,i)=>i+1);

function src(n){
return `website-${n}.jpg`;
}

/* BUILD EDITORIAL BLOCKS */
function build(){
const container=document.getElementById("container");

// shuffle all images
let shuffled=[...ALL].sort(()=>0.5-Math.random());

for(let i=0;i<shuffled.length;i+=5){

const block=document.createElement("div");
block.className="grid";

/* BIG IMAGE */
const big=document.createElement("img");
big.src=src(shuffled[i]);
big.className="big";
big.onclick=()=>openLB(big.src);

/* RIGHT SIDE */
const stack1=document.createElement("div");
stack1.className="small-stack";

const stack2=document.createElement("div");
stack2.className="small-stack";

[1,2].forEach(j=>{
if(shuffled[i+j]){
let img=document.createElement("img");
img.src=src(shuffled[i+j]);
img.onclick=()=>openLB(img.src);
stack1.appendChild(img);
}
});

[3,4].forEach(j=>{
if(shuffled[i+j]){
let img=document.createElement("img");
img.src=src(shuffled[i+j]);
img.onclick=()=>openLB(img.src);
stack2.appendChild(img);
}
});

block.appendChild(big);
block.appendChild(stack1);
block.appendChild(stack2);

container.appendChild(block);
}
}

function openLB(src){
document.getElementById("lb-img").src=src;
document.getElementById("lightbox").classList.add("open");
}

function closeLB(){
document.getElementById("lightbox").classList.remove("open");
}

build();
</script>

</body>
</html>
