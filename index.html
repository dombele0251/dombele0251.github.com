<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dombele — Photographer</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
--bg:#ffffff;
--text:#111;
--muted:#888;
--line:#e8e8e8;
}

body{
background:var(--bg);
font-family:"Inter",sans-serif;
font-size:11px;
letter-spacing:.04em;
color:var(--text);
overflow-x:hidden;
}

/* FADE TRANSITION */
.fade{
opacity:0;
transform:translateY(10px);
transition:opacity .6s ease, transform .6s ease;
}
.fade.show{
opacity:1;
transform:translateY(0);
}

/* NAV */
header{
position:fixed;
top:0;
left:0;
right:0;
height:48px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 28px;
border-bottom:1px solid var(--line);
background:white;
z-index:100;
}

.logo{
font-family:"Cormorant Garamond",serif;
font-size:18px;
letter-spacing:.12em;
cursor:pointer;
}

nav{display:flex;gap:28px;}

nav a{
text-decoration:none;
color:var(--muted);
font-size:10px;
letter-spacing:.14em;
text-transform:uppercase;
}
nav a.active{color:var(--text);}

/* MAIN */
main{padding-top:48px;}

/* HOME */
.category-row{
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
height:64px;
cursor:pointer;
overflow:hidden;
transition:height .4s ease;
}

.category-row:hover{height:200px;}

.category-row__label{
width:220px;
padding:0 28px;
font-family:"Cormorant Garamond",serif;
font-size:28px;
}

.category-row__preview{
display:flex;
gap:4px;
flex:1;
opacity:0;
transition:.4s;
}

.category-row:hover .category-row__preview{
opacity:1;
}

.category-row__preview img{
height:180px;
}

/* SECTIONS */
.section{display:none;}
.section.active{display:block;}

.section-header{
padding:20px 28px;
border-bottom:1px solid var(--line);
display:flex;
gap:16px;
}

.section-title{
font-family:"Cormorant Garamond",serif;
font-size:22px;
}

.section-back{
cursor:pointer;
background:none;
border:none;
font-size:10px;
color:var(--muted);
}

/* GRID */
.photo-grid{
display:grid;
gap:6px;
padding:6px;
}

.fashion{grid-template-columns:repeat(4,1fr);}
.concert{grid-template-columns:repeat(5,1fr);}
.studio{grid-template-columns:repeat(3,1fr);}
.gym{grid-template-columns:repeat(2,1fr);}

.photo-grid figure{
aspect-ratio:2/3;
overflow:hidden;
background:#eee;
cursor:pointer;
}

.photo-grid img{
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transform:scale(1.02);
transition:opacity .6s ease, transform .8s ease;
}

.photo-grid img.loaded{
opacity:1;
transform:scale(1);
}

.photo-grid figure:hover img{
transform:scale(1.04);
}

/* LIGHTBOX */
.lightbox{
position:fixed;
inset:0;
background:black;
display:none;
align-items:center;
justify-content:center;
z-index:500;
}

.lightbox.open{display:flex;}

.lightbox img{
max-width:90%;
max-height:90%;
}

.lightbox-close{
position:absolute;
top:20px;
right:20px;
color:white;
background:none;
border:none;
cursor:pointer;
}

.lightbox-nav{
position:absolute;
top:50%;
transform:translateY(-50%);
color:white;
background:none;
border:none;
font-size:30px;
cursor:pointer;
}

.prev{left:20px;}
.next{right:20px;}

/* FOOTER */
footer{
padding:30px;
border-top:1px solid var(--line);
display:flex;
justify-content:space-between;
}

/* MOBILE */
@media(max-width:700px){
.fashion,.concert,.studio{grid-template-columns:repeat(2,1fr);}
.gym{grid-template-columns:1fr;}
}
</style>

</head>

<body>

<header>
<div class="logo" onclick="goHome()">DOMBELE</div>
<nav>
<a onclick="openSection('fashion')">Fashion</a>
<a onclick="openSection('concert')">Concert</a>
<a onclick="openSection('studio')">Studio</a>
<a onclick="openSection('gym')">Gym</a>
</nav>
</header>

<main>

<div id="home">
<div class="category-row" onclick="openSection('fashion')">
<div class="category-row__label">Fashion</div>
<div class="category-row__preview" id="prev-fashion"></div>
</div>

<div class="category-row" onclick="openSection('concert')">
<div class="category-row__label">Concert</div>
<div class="category-row__preview" id="prev-concert"></div>
</div>

<div class="category-row" onclick="openSection('studio')">
<div class="category-row__label">Studio</div>
<div class="category-row__preview" id="prev-studio"></div>
</div>

<div class="category-row" onclick="openSection('gym')">
<div class="category-row__label">Gym</div>
<div class="category-row__preview" id="prev-gym"></div>
</div>
</div>

<!-- SECTIONS -->

<div id="fashion" class="section fade">
<div class="section-header">
<button class="section-back" onclick="goHome()">← Index</button>
<div class="section-title">Fashion</div>
</div>
<div class="photo-grid fashion" id="fashion-grid"></div>
</div>

<div id="concert" class="section fade">
<div class="section-header">
<button class="section-back" onclick="goHome()">← Index</button>
<div class="section-title">Concert</div>
</div>
<div class="photo-grid concert" id="concert-grid"></div>
</div>

<div id="studio" class="section fade">
<div class="section-header">
<button class="section-back" onclick="goHome()">← Index</button>
<div class="section-title">Studio</div>
</div>
<div class="photo-grid studio" id="studio-grid"></div>
</div>

<div id="gym" class="section fade">
<div class="section-header">
<button class="section-back" onclick="goHome()">← Index</button>
<div class="section-title">Gym</div>
</div>
<div class="photo-grid gym" id="gym-grid"></div>
</div>

</main>

<footer>
<span>© Dombele</span>
<span>Photographer</span>
</footer>

<div class="lightbox" id="lightbox">
<button class="lightbox-close" onclick="closeLightbox()">Close</button>
<button class="lightbox-nav prev" onclick="shift(-1)">‹</button>
<img id="lb-img">
<button class="lightbox-nav next" onclick="shift(1)">›</button>
</div>

<script>
const DATA={
fashion:[87,90,93,94,95,107,108,109,110],
concert:[91,92,96,97,98,99,100,101,102,103],
studio:[146,147,148,150,151,153,155,156,157],
gym:[200,201,202,203,204,234]
};

let current=[],index=0;

function src(n){return `website-${n}.jpg`;}

/* BUILD */
function build(id,data){
const grid=document.getElementById(id);
grid.innerHTML="";
data.forEach((n,i)=>{
const fig=document.createElement("figure");
const img=document.createElement("img");
img.src=src(n);

img.onload=()=>img.classList.add("loaded");
img.onerror=()=>fig.remove();

fig.appendChild(img);
fig.onclick=()=>openLB(id,i);

grid.appendChild(fig);
});
}

function previews(){
Object.entries(DATA).forEach(([k,v])=>{
const el=document.getElementById("prev-"+k);
el.innerHTML="";
v.slice(0,6).forEach(n=>{
const img=document.createElement("img");
img.src=src(n);
el.appendChild(img);
});
});
}

build("fashion-grid",DATA.fashion);
build("concert-grid",DATA.concert);
build("studio-grid",DATA.studio);
build("gym-grid",DATA.gym);
previews();

/* NAV */
function openSection(id){
document.getElementById("home").style.display="none";
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));

const sec=document.getElementById(id);
sec.classList.add("active");

setTimeout(()=>sec.classList.add("show"),50);

window.scrollTo(0,0);
}

function goHome(){
document.querySelectorAll(".section").forEach(s=>{
s.classList.remove("active","show");
});
document.getElementById("home").style.display="block";
closeLightbox();
}

/* LIGHTBOX */
function openLB(gridId,i){
const imgs=document.querySelectorAll(`#${gridId} img`);
current=[...imgs].map(i=>i.src);
index=i;
updateLB();
document.getElementById("lightbox").classList.add("open");
}

function updateLB(){
document.getElementById("lb-img").src=current[index];
}

function shift(dir){
index=(index+dir+current.length)%current.length;
updateLB();
}

function closeLightbox(){
document.getElementById("lightbox").classList.remove("open");
}

document.addEventListener("keydown",e=>{
if(!document.getElementById("lightbox").classList.contains("open")) return;
if(e.key==="ArrowRight") shift(1);
if(e.key==="ArrowLeft") shift(-1);
if(e.key==="Escape") closeLightbox();
});
</script>

</body>
</html>
