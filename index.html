<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOMBELE — Photographer</title>
<meta name="description" content="Dombele Chindandy — Photographer. Fashion, Beauty, Portraits. UK.">

<style>

/* ---------- Base Style ---------- */

:root{
  --bg:#f6f5f3;
  --ink:#0e0e0e;
  --muted:#6b6b6b;
  --line:#e6e4e0;
  --maxw:1000px;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  text-align:center;
}

/* ---------- Layout ---------- */

.wrap{
  width:min(var(--maxw),92vw);
  margin:auto;
  padding:60px 20px;
}

/* ---------- Logo ---------- */

.logo{
  width:88px;
  margin-bottom:24px;
}

/* ---------- Typography ---------- */

.brand{
  font-size:48px;
  letter-spacing:5px;
  margin:0 0 10px;
}

.tag{
  color:var(--muted);
  font-size:16px;
  margin-bottom:20px;
}

.rule{
  width:120px;
  height:1px;
  background:var(--line);
  margin:20px auto 30px;
}

.meta{
  color:var(--muted);
  margin:5px 0;
}

a{
  color:var(--ink);
  text-decoration:none;
  border-bottom:1px solid transparent;
}

a:hover{
  border-color:var(--ink);
}

/* ---------- Portfolio Grid ---------- */

.portfolio{
  margin-top:60px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.portfolio img{
  width:100%;
  height:auto;
  display:block;
  transition:opacity .25s ease;
}

.portfolio img:hover{
  opacity:.85;
}

/* ---------- Mobile ---------- */

@media(max-width:800px){
  .portfolio{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  .portfolio{
    grid-template-columns:1fr;
  }
}

/* ---------- Footer ---------- */

footer{
  margin-top:60px;
  padding-top:20px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:14px;
}

</style>
</head>

<body>

<main class="wrap">

<img src="black logo.png" alt="Dombele logo" class="logo">

<h1 class="brand">DOMBELE</h1>

<p class="tag">Photographer · Fashion | Beauty | Portraits</p>

<div class="rule"></div>

<p class="meta">📍 UK</p>
<p class="meta"><a href="mailto:studio@dombele.com">studio@dombele.com</a></p>
<p class="meta"><a href="https://instagram.com/dombele.studio" target="_blank">@dombele.studio</a></p>

<!-- Portfolio Images -->

<section class="portfolio">

<img src="fashion-01.jpg" loading="lazy">
<img src="fashion-02.jpg" loading="lazy">
<img src="fashion-03.jpg" loading="lazy">

<img src="beauty-01.jpg" loading="lazy">
<img src="beauty-02.jpg" loading="lazy">

<img src="commercial-01.jpg" loading="lazy">
<img src="editorial-01.jpg" loading="lazy">

<img src="portrait-01.jpg" loading="lazy">
<img src="portrait-02.jpg" loading="lazy">

</section>

<footer>
© 2026 Dombele Chindandy — All rights reserved.
</footer>

</main>

</body>
</html>
