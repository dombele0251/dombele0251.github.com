<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dombele — Photographer</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
--bg:#ffffff;
--text:#111;
--muted:#888;
}

body{
background:var(--bg);
font-family:"Inter",sans-serif;
font-size:11px;
letter-spacing:.05em;
color:var(--text);
overflow-x:hidden;
}

/* NAV */
header{
position:fixed;
top:0;left:0;right:0;
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 40px;
z-index:100;
background:white;
}

.logo img{height:30px;}

nav{display:flex;gap:32px;}
nav a{
font-size:10px;
letter-spacing:.18em;
text-transform:uppercase;
color:var(--muted);
cursor:pointer;
transition:.3s;
}
nav a:hover{color:var(--text);}

/* HOME SPLIT */
.home{
display:grid;
grid-template-columns:300px 1fr;
height:100vh;
padding-top:70px;
}

/* LEFT */
.categories{
display:flex;
flex-direction:column;
justify-content:center;
gap:30px;
padding-left:40px;
}

.cat{
font-family:"Cormorant Garamond",serif;
font-size:34px;
cursor:pointer;
opacity:.4;
transition:.4s;
}
.cat.active,.cat:hover{opacity:1;}

/* RIGHT PREVIEW */
.preview{
position:relative;
overflow:hidden;
}

.preview img{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transform:scale(1.05);
transition:opacity 1s ease, transform 6s ease;
}

.preview img.active{
opacity:1;
transform:scale(1);
}

/* SECTIONS */
.section{
position:fixed;
inset:0;
background:white;
opacity:0;
pointer-events:none;
transition:.6s ease;
overflow-y:auto;
padding-top:70px;
}

.section.active{
opacity:1;
pointer-events:auto;
}

/* HEADER */
.section-header{
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.section-title{
font-family:"Cormorant Garamond",serif;
font-size:28px;
}

.back{
font-size:10px;
letter-spacing:.2em;
cursor:pointer;
color:var(--muted);
}

/* EDITORIAL GRID */
.gallery{
column-count:3;
column-gap:8px;
padding:8px;
}

.gallery img{
width:100%;
margin-bottom:8px;
opacity:0;
transform:translateY(20px);
transition:.8s ease;
cursor:pointer;
}

.gallery img.show{
opacity:1;
transform:translateY(0);
}

.gallery img:hover{
transform:scale(1.02);
}

/* LIGHTBOX */
.lightbox{
position:fixed;
inset:0;
background:black;
display:none;
align-items:center;
justify-content:center;
z-index:200;
}
.lightbox.open{display:flex;}

.lightbox img{
max-width:90%;
max-height:90%;
}

/* MOBILE */
@media(max-width:800px){
.home{grid-template-columns:1fr;}
.categories{flex-direction:row;justify-content:space-around;}
.gallery{column-count:1;}
}
</style>

</head>

<body>

<header>
<div class="logo"><img src="black logo.png"></div>
<nav>
<a onclick="openSection('fashion')">Fashion</a>
<a onclick="openSection('concert')">Concert</a>
<a onclick="openSection('studio')">Studio</a>
<a onclick="openSection('gym')">Gym</a>
</nav>
</header>

<!-- HOME -->

<div class="home" id="home">
<div class="categories">
<div class="cat" data-cat="fashion">Fashion</div>
<div class="cat" data-cat="concert">Concert</div>
<div class="cat" data-cat="studio">Studio</div>
<div class="cat" data-cat="gym">Gym</div>
</div>

<div class="preview" id="preview"></div>
</div>

<!-- SECTIONS -->

<div id="fashion" class="section">
<div class="section-header">
<div class="section-title">Fashion</div>
<div class="back" onclick="goHome()">Back</div>
</div>
<div class="gallery" id="fashion-grid"></div>
</div>

<div id="concert" class="section">
<div class="section-header">
<div class="section-title">Concert</div>
<div class="back" onclick="goHome()">Back</div>
</div>
<div class="gallery" id="concert-grid"></div>
</div>

<div id="studio" class="section">
<div class="section-header">
<div class="section-title">Studio</div>
<div class="back" onclick="goHome()">Back</div>
</div>
<div class="gallery" id="studio-grid"></div>
</div>

<div id="gym" class="section">
<div class="section-header">
<div class="section-title">Gym</div>
<div class="back" onclick="goHome()">Back</div>
</div>
<div class="gallery" id="gym-grid"></div>
</div>

<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox" onclick="closeLB()">
<img id="lb-img">
</div>

<script>
const DATA={
fashion:[87,90,93,94,95,107,108,109,110],
concert:[91,92,96,97,98,99,100,101,102,103],
studio:[146,147,148,150,151,153,155,156,157],
gym:[200,201,202,203,204,234]
};

function src(n){return `website-${n}.jpg`;}

/* BUILD GALLERIES */
function build(id,data){
const grid=document.getElementById(id);
data.forEach((n,i)=>{
const img=document.createElement("img");
img.src=src(n);
img.onload=()=>setTimeout(()=>img.classList.add("show"),i*80);
img.onclick=()=>openLB(img.src);
grid.appendChild(img);
});
}

build("fashion-grid",DATA.fashion);
build("concert-grid",DATA.concert);
build("studio-grid",DATA.studio);
build("gym-grid",DATA.gym);

/* PREVIEW HOVER SYSTEM */
const preview=document.getElementById("preview");

document.querySelectorAll(".cat").forEach(cat=>{
cat.addEventListener("mouseenter",()=>{
const name=cat.dataset.cat;
showPreview(DATA[name]);
});
});

function showPreview(arr){
preview.innerHTML="";
arr.slice(0,6).forEach((n,i)=>{
const img=document.createElement("img");
img.src=src(n);
if(i===0) img.classList.add("active");
preview.appendChild(img);
});
}

/* NAV */
function openSection(id){
document.getElementById("home").style.display="none";
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function goHome(){
document.getElementById("home").style.display="grid";
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
}

/* LIGHTBOX */
function openLB(src){
document.getElementById("lb-img").src=src;
document.getElementById("lightbox").classList.add("open");
}
function closeLB(){
document.getElementById("lightbox").classList.remove("open");
}
</script>

</body>
</html>
