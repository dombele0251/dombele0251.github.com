<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dombele — Loewe Style</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#fff;
  font-family:Helvetica, Arial, sans-serif;
  color:#111;
}

/* ─── HEADER ─── */
header{
  padding:50px 40px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:14px;
  letter-spacing:.25em;
}

.nav{
  display:flex;
  gap:30px;
  font-size:11px;
  letter-spacing:.2em;
}

.nav span{
  opacity:.4;
  cursor:pointer;
}

.nav span:hover{
  opacity:1;
}

/* ─── MASONRY ─── */
.masonry{
  column-count:4;
  column-gap:14px;
  padding:0 40px 60px;
}

@media(max-width:1000px){
  .masonry{column-count:3;}
}
@media(max-width:700px){
  .masonry{column-count:2;}
}
@media(max-width:500px){
  .masonry{column-count:1;}
}

.item{
  break-inside:avoid;
  margin-bottom:14px;
  position:relative;
}

.item img{
  width:100%;
  display:block;
  filter:contrast(1.02) brightness(.98);
  transition:transform .8s ease, filter .6s ease;
  cursor:pointer;
}

.item:hover img{
  transform:scale(1.025);
  filter:contrast(1.08) brightness(1);
}

/* subtle caption (Loewe feel) */
.caption{
  position:absolute;
  bottom:10px;
  left:12px;
  font-size:9px;
  letter-spacing:.18em;
  color:#fff;
  opacity:0;
  transition:opacity .3s;
}

.item:hover .caption{
  opacity:.8;
}

/* ─── LIGHTBOX ─── */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.96);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.lightbox.open{
  display:flex;
}

.lightbox img{
  max-width:90vw;
  max-height:90vh;
}

.close{
  position:absolute;
  top:30px;
  right:40px;
  color:#fff;
  font-size:11px;
  letter-spacing:.2em;
  cursor:pointer;
  opacity:.6;
}

.close:hover{opacity:1;}

</style>
</head>
<body>

<header>
  <div class="logo">DOMBELE</div>
  <div class="nav">
    <span>FASHION</span>
    <span>CONCERT</span>
    <span>STUDIO</span>
    <span>GYM</span>
  </div>
</header>

<div class="masonry" id="grid"></div>

<div class="lightbox" id="lightbox" onclick="closeLB()">
  <span class="close">CLOSE</span>
  <img id="lb-img">
</div>

<script>
const images = [
  9,12,31,40,41,43,53,
  55,62,68,71,72,79,91,
  136,142,179,197,227,234,236,
  239,240,242
];

const grid = document.getElementById("grid");

images.forEach(n => {
  const div = document.createElement("div");
  div.className = "item";

  const img = document.createElement("img");
  img.src = `website-${n}.jpg`;
  img.loading = "lazy";

  const cap = document.createElement("div");
  cap.className = "caption";
  cap.textContent = "DOMBELE";

  img.onclick = () => openLB(img.src);

  div.appendChild(img);
  div.appendChild(cap);
  grid.appendChild(div);
});

function openLB(src){
  document.getElementById("lb-img").src = src;
  document.getElementById("lightbox").classList.add("open");
}

function closeLB(){
  document.getElementById("lightbox").classList.remove("open");
}
</script>

</body>
</html>
